name: Günlük Ekoloji Taraması

on:
  schedule:
    # Her gün saat 06:00 Türkiye saati (UTC+3 → 03:00 UTC)
    - cron: "0 3 * * *"
  # Elle de başlatılabilir
  workflow_dispatch:

jobs:
  tara:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data.json'u commit edebilmek için

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          # tarama.py sadece standart kütüphane kullanıyor, ekstra paket gerekmez
          echo "Bağımlılıklar tamam."

      - name: Taramayı çalıştır
        env:
          DATA_JSON_PATH: data.json
        run: python tarama.py

      - name: Değişiklik var mı kontrol et
        id: degisiklik
        run: |
          git diff --quiet data.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: data.json'u commit et
        if: steps.degisiklik.outputs.changed == 'true'
        run: |
          git config user.name  "ekoloji-bot"
          git config user.email "bot@ekoloji-izleme.com"
          git add data.json
          git commit -m "🌿 Otomatik tarama: $(date +'%Y-%m-%d %H:%M') UTC"
          git push

      - name: Değişiklik yoksa bildir
        if: steps.degisiklik.outputs.changed == 'false'
        run: echo "data.json değişmedi, commit atlandı."

  # Tarama başarısız olursa bildirim (opsiyonel — email ayarı gerekmez, sadece Actions loguna yazılır)
  basarisiz_bildir:
    needs: tara
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Hata logu
        run: |
          echo "⚠️ Tarama başarısız oldu: $(date)"
          echo "GitHub Actions loglarını kontrol et."
