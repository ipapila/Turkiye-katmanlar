name: Veri Güncelleme + Flex Push

on:
  schedule:
    - cron: '0 3 * * *'   # Her gece 03:00 UTC (06:00 Türkiye)
  workflow_dispatch:       # Elle de tetiklenebilir

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Veriyi güncelle (guncelle.py)
        run: python scripts/guncelle.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: data.json'u Flex sunucuya gönder
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.FLEX_WEBHOOK_URL }}" \
            -H "X-Webhook-Secret: ${{ secrets.FLEX_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --data-binary @data.json)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/webhook_response.txt
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️  Webhook başarısız (HTTP $HTTP_STATUS) — workflow devam ediyor."
          else
            echo "✅ Flex sunucu güncellendi."
          fi
